
ame: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file hellocucumber/pom.xml -DskipTests

      - name: Run tests
        run: mvn test --file hellocucumber/pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ya34ine/hotelbay-app:latest ./hellocucumber

      - name: Push Docker image
        run: docker push ya34ine/hotelbay-app:latest

      - name: Deploy via SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run deployment
        run: |
          ssh -o StrictHostKeyChecking=no deploy@deves.xdi.uevora.pt "mkdir -p ~/app"
          scp -o StrictHostKeyChecking=no hellocucumber/docker-compose.yml deploy@deves.xdi.uevora.pt:~/app
          ssh -o StrictHostKeyChecking=no deploy@deves.xdi.uevora.pt "cd ~/app && docker compose pull && docker compose up -d"