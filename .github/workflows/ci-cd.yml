name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file hellocucumber/pom.xml -DskipTests

      - name: Run tests
        run: mvn test --file hellocucumber/pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ya34ine/hotelbay-app:latest ./hellocucumber

      - name: Push Docker image
        run: docker push ya34ine/hotelbay-app:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            mkdir -p ~/app
            cd ~/app
            docker pull ya34ine/hotelbay-app:latest
            cat > docker-compose.yml << 'COMPOSE'
            services:
              hotelbay-db:
                image: postgres:15
                environment:
                  POSTGRES_DB: hotelbay
                  POSTGRES_USER: hotelbay
                  POSTGRES_PASSWORD: hotelbay123
              hotelbay-app:
                image: ya34ine/hotelbay-app:latest
                ports:
                  - "8080:8080"
                environment:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://hotelbay-db:5432/hotelbay
                  SPRING_DATASOURCE_USERNAME: hotelbay
                  SPRING_DATASOURCE_PASSWORD: hotelbay123
                  SPRING_JPA_HIBERNATE_DDL_AUTO: update
                depends_on:
                  - hotelbay-db
            COMPOSE
            docker compose up -d